<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noggit Diamond — WoW Map Editor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/app/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="topbar"></div>
      <div id="workspace">
        <div id="toolbar"></div>
        <div id="viewport"><canvas id="canvas"></canvas><div id="drop-hint">Drop <b>.adt</b> files here<br/><span>or use File ▸ New Map to start from scratch</span></div></div>
        <div id="sidebar"></div>
      </div>
      <div id="statusbar"></div>
      <div id="minimap-wrap"><canvas id="minimap" width="192" height="192"></canvas></div>
      <div id="console-wrap" class="hidden">
        <div id="console-head">Diamond Script Console <span id="console-close">✕</span></div>
        <div id="console-out"></div>
        <textarea id="console-in" spellcheck="false" placeholder="JavaScript with `nd` API — e.g.  nd.raise(nd.cursor.x, nd.cursor.z, 40, 10, 'smooth', 5)"></textarea>
        <div id="console-hint">Ctrl+Enter to run · ` to toggle</div>
      </div>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
