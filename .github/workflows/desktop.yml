name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'electron/**'
      - 'electron-builder.yml'
      - 'NoggitDiamond.sln'
      - 'NoggitDiamond.esproj'
      - '.github/workflows/desktop.yml'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Builds the host OS's targets from electron-builder.yml
      # (Linux AppImage / Windows NSIS+portable / macOS dmg+zip).
      - run: npx electron-builder --publish never
      - name: Smoke-test packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          NOGGIT_SMOKE=$PWD/release/smoke.png xvfb-run -a \
            release/linux-unpacked/noggit-diamond --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: noggit-diamond-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            release/smoke.png
          if-no-files-found: error

  # The exact Visual Studio flow: restore + build the solution with MSBuild,
  # which runs the MakeExecutable target and produces the Windows installer.
  vs-solution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: microsoft/setup-msbuild@v2
      - run: npm ci
      - name: Build solution (Release)
        run: msbuild /restore NoggitDiamond.sln /p:Configuration=Release /v:minimal
      - name: Verify executable exists
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/NoggitDiamond-Setup-*.exe
          if (-not $setup) { throw "installer not produced" }
          Write-Host "Built: $($setup.Name) ($([math]::Round($setup.Length/1MB)) MB)"
      - uses: actions/upload-artifact@v4
        with:
          name: noggit-diamond-vs-solution
          path: release/*.exe
          if-no-files-found: error
